[project]
name = "joonak-backend"
version = "0.1.0"
description = "Joonak Django backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.17,<5.3",
    "djangorestframework>=3.16,<4",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "redis>=5,<7",
    "gunicorn>=23,<26",
    "whitenoise>=6.9,<7",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
    "torch>=2.6,<3",
    "opencv-python-headless>=4.10,<6",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["config", "ai"]
